[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdm"
version = "0.1.0"
description = "Predictive maintenance reference pipeline on the NASA CMAPSS turbofan dataset."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naoya Higashitani" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
viz = ["plotly>=5.20", "dash>=2.17"]
boost = ["xgboost>=2.0"]
deep = ["torch>=2.2"]
notebooks = ["jupyterlab>=4.2", "ipywidgets>=8.1", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/eastani/predictive-maintenance-cmapss"
Repository = "https://github.com/eastani/predictive-maintenance-cmapss"

[tool.hatch.build.targets.wheel]
packages = ["src/pdm"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=pdm --cov-branch --cov-report=term-missing"
markers = [
    "slow: tests that load real data and take noticeable wall-clock time",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/pdm"]
