  <rect x="752.0" y="38.0" width="14.0" height="14.0" rx="3" fill="#C53030"/>
  <text x="774.0" y="50.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5568" text-anchor="start">late</text>
