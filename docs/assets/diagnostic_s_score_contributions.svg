<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Early versus late S-score contribution</title>
  <desc id="desc">Stacked bars showing early and late shares of total S-score.</desc>
  <rect width="980" height="430" fill="#FFFFFF"/>
  <text x="40.0" y="42.0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A202C" text-anchor="start">S-score contribution by error direction</text>
  <text x="40.0" y="66.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5568" text-anchor="start">FD002 is dominated by early predictions; FD004 has more late-prediction cost.</text>
  <line x1="220.0" y1="76.0" x2="220.0" y2="368.0" stroke="#CBD5E0" stroke-width="1"/>
  <text x="220.0" y="392.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">0%</text>
  <line x1="382.5" y1="76.0" x2="382.5" y2="368.0" stroke="#CBD5E0" stroke-width="1"/>
  <text x="382.5" y="392.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">25%</text>
  <line x1="545.0" y1="76.0" x2="545.0" y2="368.0" stroke="#CBD5E0" stroke-width="1"/>
  <text x="545.0" y="392.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">50%</text>
  <line x1="707.5" y1="76.0" x2="707.5" y2="368.0" stroke="#CBD5E0" stroke-width="1"/>
  <text x="707.5" y="392.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">75%</text>
  <line x1="870.0" y1="76.0" x2="870.0" y2="368.0" stroke="#CBD5E0" stroke-width="1"/>
  <text x="870.0" y="392.0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#4A5568" text-anchor="middle">100%</text>
  <text x="40.0" y="116.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C" text-anchor="start">FD002 Ridge</text>
  <rect x="220.0" y="96.0" width="607.4" height="30.0" rx="3" fill="#2F855A"/>
  <rect x="827.4" y="96.0" width="42.6" height="30.0" rx="3" fill="#C53030"/>
  <text x="523.7" y="116.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">93.4%</text>
  <text x="878.0" y="116.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#1A202C" text-anchor="start">6.6%</text>
  <text x="40.0" y="186.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C" text-anchor="start">FD002 XGBoost</text>
  <rect x="220.0" y="166.0" width="594.4" height="30.0" rx="3" fill="#2F855A"/>
  <rect x="814.4" y="166.0" width="55.6" height="30.0" rx="3" fill="#C53030"/>
  <text x="517.2" y="186.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">91.5%</text>
  <text x="842.2" y="186.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">8.6%</text>
  <text x="40.0" y="256.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C" text-anchor="start">FD004 Ridge</text>
  <rect x="220.0" y="236.0" width="495.2" height="30.0" rx="3" fill="#2F855A"/>
  <rect x="715.2" y="236.0" width="154.8" height="30.0" rx="3" fill="#C53030"/>
  <text x="467.6" y="256.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">76.2%</text>
  <text x="792.6" y="256.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">23.8%</text>
  <text x="40.0" y="326.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C" text-anchor="start">FD004 XGBoost</text>
  <rect x="220.0" y="306.0" width="448.5" height="30.0" rx="3" fill="#2F855A"/>
  <rect x="668.5" y="306.0" width="201.5" height="30.0" rx="3" fill="#C53030"/>
  <text x="444.2" y="326.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">69.0%</text>
  <text x="769.2" y="326.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle">31.0%</text>
  <rect x="672.0" y="38.0" width="14.0" height="14.0" rx="3" fill="#2F855A"/>
